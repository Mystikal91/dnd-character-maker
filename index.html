<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7a1f1f" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>Heroquill</title>
    <script>
      // Apply the saved look before the first paint, so the page never flashes the wrong theme.
      try {
        var saved = JSON.parse(localStorage.getItem("theme") || "{}");
        var root = document.documentElement;
        root.dataset.style = saved.style === "modern" ? "modern" : "fantasy";
        if (saved.scheme === "light" || saved.scheme === "dark") root.dataset.theme = saved.scheme;
      } catch (e) {
        document.documentElement.dataset.style = "fantasy";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
